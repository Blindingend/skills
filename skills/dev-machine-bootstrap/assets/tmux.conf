# Shared tmux configuration for dev-machine-bootstrap.

set-option -g prefix `
unbind C-b
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g automatic-rename on
set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind - split-window -v
bind \\ split-window -h

set-option -g pane-border-style "fg=white"
set-option -g pane-active-border-style "fg=green"

set-option -g status on
set-option -g status-interval 1
set-option -g status-position bottom
set-option -g status-justify centre
set-option -g status-style "bg=black,fg=white"
set-option -g status-left-length 40
set-option -g status-left "#[fg=green,bold]  Session: #S  "
set-option -g status-right-length 60
set-option -g status-right "#[fg=red]%Y-%m-%d #[fg=blue]%H:%M:%S "

set-window-option -g window-status-current-style "fg=green,bg=default,bold"
set-window-option -g window-status-current-format " #I:#W#F "
set-window-option -g window-status-style "fg=white,bg=default"
set-window-option -g window-status-format " #I:#W#F "
set-window-option -g window-status-activity-style "fg=yellow,bg=default"
set-window-option -g window-status-separator " "
